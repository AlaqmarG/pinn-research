[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnlab"
version = "0.1.0"
description = "Physics-informed neural network experiments on Newton cooling"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "torch>=2.11",
    "numpy>=2.5",
    "matplotlib>=3.11",
    "cma>=4.6",
]

[project.optional-dependencies]
dev = ["ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["experiments/*/provenance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
